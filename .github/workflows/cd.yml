name: CD

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: vps
        type: choice
        options:
          - vps
          - aws

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy to VPS
        if: ${{ github.event.inputs.environment == 'vps' }}
        run: |
          echo "ssh hostinger 'docker pull $REGISTRY/$IMAGE_NAME:latest && docker compose up -d'"
          # ssh ${{ secrets.VPS_HOST }} "
          #   docker pull $REGISTRY/$IMAGE_NAME:latest &&
          #   cd /app/auth-service &&
          #   docker compose -f docker/docker-compose.vps.yml up -d
          # "

      - name: Deploy to AWS
        if: ${{ github.event.inputs.environment == 'aws' }}
        run: |
          echo "aws ecs update-service --cluster safehire --service auth-service --force-new-deployment"
          # aws ecs update-service \
          #   --cluster safehire-auth \
          #   --service auth-service \
          #   --force-new-deployment \
          #   --region us-east-1
